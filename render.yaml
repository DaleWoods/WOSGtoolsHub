databases:
  - name: wosg-tools-hub-db
    plan: starter
    postgresMajorVersion: 16

services:
  - type: web
    name: wosg-tools-hub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wosg-tools-hub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_IP_RANGES
        sync: false
      - key: NODE_ENV
        value: production
